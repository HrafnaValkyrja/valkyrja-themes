<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valkyrja Themes</title>
<style>
:root { color-scheme: dark; --base: #000000; --s2: #0e1015; --line: #2c3340; --lineHi: #556384; --text: #b9c0cf; --text2: #8c95a8; --text3: #777f92; --accent: #6a93d8; }
body { margin: 0; padding: 14px 16px; width: 330px; background: var(--base); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
label { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
label span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
#grant { background: var(--s2); border: 1px solid var(--lineHi); font: inherit; cursor: pointer; margin-top: 10px; width: 100%; padding: 8px; color: var(--accent); }
#grant:hover { border-color: var(--accent); }
h2 { margin: 0; padding: 10px 0 8px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); }
#themes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
/* Each card is a small page drawn in that theme's own colours (set as --t-* on the card). */
.card { all: unset; box-sizing: border-box; cursor: pointer; display: block; background: var(--t-base); border: 1px solid var(--t-line); outline: 2px solid transparent; outline-offset: 1px; }
.card:hover, .card:focus-visible { outline-color: var(--text3); }
.card[aria-checked=true] { outline-color: var(--accent); }
.mini { display: flex; height: 46px; }
.mini .side { width: 26%; background: var(--t-s1); border-right: 1px solid var(--t-lineHi); padding: 4px 3px; }
.mini .side i { display: block; height: 6px; background: var(--t-fill); margin-bottom: 4px; }
.mini .side b { display: block; height: 3px; background: var(--t-text3); margin-bottom: 3px; }
.mini .main { flex: 1; padding: 5px; }
.mini .main u { display: block; height: 3px; margin-bottom: 4px; background: var(--t-text); width: 90%; }
.mini .main u + u { background: var(--t-accent); width: 55%; }
.mini .main s { display: block; height: 14px; background: var(--t-s2); border: 1px solid var(--t-line); }
.dots { display: flex; height: 7px; }
.dots span { flex: 1; }
.name { display: block; padding: 3px 5px 4px; background: var(--t-s1); color: var(--t-text); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card[aria-checked=true] .name { color: var(--t-accent); font-weight: 600; }
[hidden] { display: none; }
</style>
</head>
<body>
<h1>Valkyrja Themes</h1>
<label><span>On everywhere</span><input type="checkbox" id="enabled"></label>
<label id="site-row" hidden><span id="site-name"></span><input type="checkbox" id="site"></label>
<h2 id="themes-title">Theme</h2>
<div id="themes" role="radiogroup" aria-labelledby="themes-title"></div>
<button id="grant" hidden>Allow on all websites</button>
<script src="popup.js"></script>
</body>
</html>
